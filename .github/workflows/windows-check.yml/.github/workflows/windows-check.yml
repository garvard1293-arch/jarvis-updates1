name: Windows Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check required files
        shell: pwsh
        run: |
          $required = @(
            'jarvis-win11/jarvis_app.py',
            'jarvis-win11/studio.py',
            'jarvis-win11/updater.py',
            'jarvis-win11/requirements.txt',
            'jarvis-win11/install.bat',
            'jarvis-win11/start.bat',
            'update.json'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error ('Missing files: ' + ($missing -join ', ')) }

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r jarvis-win11/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile jarvis-win11/jarvis_app.py jarvis-win11/studio.py jarvis-win11/updater.py

      - name: Scan for obvious secrets
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\\.(git|venv|pyc)(\\|$)' }
          $patterns = @('AIza[0-9A-Za-z_-]{20,}', 'ghp_[0-9A-Za-z]{20,}', 'sk-[0-9A-Za-z]{20,}', 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY')
          foreach ($file in $files) {
            $text = Get-Content -Raw -LiteralPath $file.FullName -ErrorAction SilentlyContinue
            foreach ($pattern in $patterns) {
              if ($text -match $pattern) { Write-Error ('Possible secret found in ' + $file.FullName) }
            }
          }

      - name: Validate update manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw update.json | ConvertFrom-Json
          if (-not $manifest.version) { throw 'update.json has no version' }
          if (-not $manifest.download_url) { throw 'update.json has no download_url' }
          if ($manifest.sha256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'update.json has invalid sha256' }

      - name: Build ZIP
        shell: pwsh
        run: |
          if (Test-Path JARVIS-ci.zip) { Remove-Item JARVIS-ci.zip }
          Compress-Archive -Path jarvis-win11 -DestinationPath JARVIS-ci.zip
          $hash = (Get-FileHash JARVIS-ci.zip -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Out-File -FilePath JARVIS-ci.sha256 -Encoding ascii
          Get-Content JARVIS-ci.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-windows-build
          path: |
            JARVIS-ci.zip
            JARVIS-ci.sha256
